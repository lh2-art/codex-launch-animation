<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Desktop build inserts CSP here; HyperFrames injects its own preview runtime. -->
  <title>ChatGPT 启动动画 · 控制台</title>
  <link rel="stylesheet" href="./settings.css" />
  <script src="./settings-model.js" defer></script>
  <script src="./settings-i18n.js" defer></script>
  <script src="./settings.js" defer></script>
  <script src="./skin-veil-controls.js" defer></script>
</head>
<body>
  <header class="app-header">
    <div><span class="app-name" data-i18n>ChatGPT 启动动画</span><span class="app-location" data-i18n>控制台</span></div>
    <div class="header-actions"><label class="language-control"><span data-i18n>语言</span><select id="ui-language" aria-label="语言 / Language"><option value="zh-CN">中文</option><option value="en">English</option></select></label><span id="plugin-state" role="status">读取设置中</span><button id="plugin-toggle" type="button" aria-pressed="true" disabled>禁用插件</button></div>
  </header>
  <main class="workspace">
    <section class="preview-column" aria-label="动画预览">
      <div class="preview-toolbar">
        <label><span data-i18n>预览画面</span><select id="phase"><option value="brand" data-i18n>结尾文字</option><option value="opening" data-i18n>开场图标</option></select></label>
        <label><span data-i18n>窗口比例</span><select id="aspect"><option value="16/9">16:9</option><option value="4/3">4:3</option><option value="1/1">1:1</option></select></label>
      </div>
      <div class="canvas-area">
        <div id="preview-frame" class="preview-frame">
          <iframe id="live-preview" src="./index.html?mode=editor" title="实时动画预览"></iframe>
          <div id="drag-surface" class="drag-surface" aria-label="拖动以调整所选对象的位置"></div>
        </div>
      </div>
      <div class="preview-actions"><button id="play-gather" type="button" data-i18n>播放文字汇聚</button><button id="play-full" class="primary" type="button" data-i18n>播放完整动画</button></div>
      <p class="preview-note" data-i18n>拖动预览可移动所选对象。全程在原生窗口内不透明播放，镜头推进固定后图标开始旋转。</p>
      <div class="save-footer"><span id="save-status" aria-live="polite">正在读取保存的配置</span><button id="reset-settings" class="text-button" type="button" data-i18n>恢复默认外观</button></div>
    </section>

    <aside class="control-column" aria-label="动画外观控制">
      <section class="control-section">
        <div class="section-title"><span>01</span><h2 data-i18n>选择对象</h2></div>
        <div class="object-tabs" role="group" aria-label="编辑对象">
          <button type="button" data-object="layout" data-i18n>整体</button><button type="button" data-object="icon" data-i18n>图标</button>
          <button type="button" data-object="motto">知行合一</button><button type="button" data-object="name" class="selected">ChatGPT</button><button type="button" data-object="caption">Codex</button>
        </div>
        <div id="object-controls"></div>
      </section>
      <section class="control-section">
        <div class="section-title"><span>02</span><h2 data-i18n>上下间距</h2></div>
        <div id="gap-controls"></div>
      </section>
      <section class="control-section">
        <div class="section-title"><span>03</span><h2 data-i18n>开场图标</h2></div>
        <div id="opening-controls"></div>
      </section>
      <section class="control-section">
        <div class="section-title"><span>04</span><h2 data-i18n>文字汇聚</h2></div>
        <div id="motion-controls"></div>
        <p class="control-note" data-i18n>1× 为原速，数值越大汇聚越快。调整后点击“播放文字汇聚”预览。</p>
      </section>
      <section class="control-section">
        <div class="section-title"><span>05</span><h2 data-i18n>皮肤遮罩</h2></div>
        <div class="control">
          <div class="control-top"><label for="skin-veil-opacity" data-i18n>黑色遮罩不透明度</label><div class="number-wrap"><input id="skin-veil-number" type="number" min="0" max="100" step="1" aria-label="遮罩百分比" disabled><span>%</span></div></div>
          <input id="skin-veil-opacity" type="range" min="0" max="100" step="1" value="0" disabled>
        </div>
        <p class="control-note" data-i18n>0% 完全透明，100% 最深；只调节当前皮肤，不影响启动动画。</p>
        <p id="skin-veil-status" class="control-note" role="status"></p>
      </section>
      <p class="control-note" data-i18n>启用后，从原桌面 ChatGPT 快捷方式打开时自动播放；禁用后直接进入原生应用。预览始终可用。</p>
    </aside>
  </main>
</body>
</html>
