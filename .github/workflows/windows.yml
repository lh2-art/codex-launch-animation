name: Windows build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            in-app-plugin/package-lock.json
      - run: npm ci
      - run: npm ci --prefix in-app-plugin
      - run: npm test
      - run: node in-app-plugin/build.mjs
      - run: node in-app-plugin/tests/mcp-smoke.mjs --dist
      - run: ./build-desktop.ps1
        shell: powershell
      - run: node tests/portable-mcp-smoke.cjs
      - run: ./scripts/package-release.ps1
        shell: powershell
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            release/*.zip
            release/SHA256SUMS.txt
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' release/*.zip release/SHA256SUMS.txt --title '${{ github.ref_name }}' --generate-notes --verify-tag
